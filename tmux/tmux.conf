# Enable 256-color and true-color (24-bit) support in tmux
set -g default-terminal "screen-256color" # Set terminal type for 256-color support
set -ga terminal-overrides ",*256col*:Tc" # Override to enable true-color for compatible terminals

set -g window-style 'fg=#565f89,bg=#16161e'
set -g window-active-style 'fg=#c0caf5,bg=#1a1b26'

# Prefix
unbind C-b
set -g prefix C-space

# Refresh tmux config with r
unbind r
bind r source-file ~/.config/tmux/tmux.conf 

# General
set -g set-clipboard on         # Use system clipboard
set -g detach-on-destroy off    # Don't exit from tmux when closing a session
set -g escape-time 0            # Remove delay for exiting insert mode with ESC in Neovim
set -g history-limit 1000000    # Increase history size (from 2,000)
set -g mouse on                 # Enable mouse support

# Splits prefer @pane_pwd (zsh's logical cwd, published per pane by .zshrc) over
# pane_current_path, which resolves symlinks and follows the foreground process.

# Split horizontally in CWD with '\'
unbind %
bind \\ split-window -h -c "#{?#{m:/*,#{@pane_pwd}},#{@pane_pwd},#{pane_current_path}}"

# Split vertically in CWD with -
unbind \"
bind - split-window -v -c "#{?#{m:/*,#{@pane_pwd}},#{@pane_pwd},#{pane_current_path}}"

# New window in same path
bind c new-window -c "#{?#{m:/*,#{@pane_pwd}},#{@pane_pwd},#{pane_current_path}}"

# Use arrow keys to resize
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5
bind -r Left resize-pane -L 5

# Enable vi mode to allow us to use vim keys to move around in copy mode (Prefix + [ places us in copy mode)
set-window-option -g mode-keys vi

# Start selecting text with "v"
bind-key -T copy-mode-vi 'v' send -X begin-selection 

# Copy text with "y"
bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "pbcopy"

# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on # Automatically renumber windows when one is closed

# Style
set -g status-left-length 100
set -g status-right " #{cpu}   #{mem}  󱛟 #{disk -f}  󱊣 #{battery} "
set -g status-justify centre

# Resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Plugins, cloned on first run into ./plugins by plugin.sh.
# Keep below the plugin options above, which the entry scripts read on load.
run-shell '~/.config/tmux/plugin.sh christoomey/vim-tmux-navigator' # Navigate between nvim and tmux
run-shell '~/.config/tmux/plugin.sh tmux-plugins/tmux-resurrect'    # Persist sessions after restart
run-shell '~/.config/tmux/plugin.sh hendrikmi/tmux-cpu-mem-monitor' # #{cpu} #{mem} #{disk} #{battery}
run-shell '~/.config/tmux/plugin.sh laktak/extrakto'                # prefix + Tab to grab text

# Continuum stays last, per its README: autosave rides on status-right, so any
# plugin that overwrites that option rather than substituting into it kills it.
run-shell '~/.config/tmux/plugin.sh tmux-plugins/tmux-continuum'    # Autosave sessions every 15 minutes
